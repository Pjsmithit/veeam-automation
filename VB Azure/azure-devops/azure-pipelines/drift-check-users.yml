# Weekly drift check for Veeam Backup for Microsoft Azure USERS AND ROLES.
# DETECTION ONLY: read-only, never changes the appliance. Fails the run when a role, MFA setting or other user setting
# differs from users/*.json, when a listed user is missing, or when an unlisted (unmanaged) user exists.

trigger: none

schedules:
  - cron: '30 6 * * 1'                     # Mondays 06:30 UTC (30 min after the policy check, which keeps free-tier parallelism to one job)
    displayName: Weekly user and role drift check
    branches:
      include: [ main ]
    always: true

pool:
  vmImage: ubuntu-latest                   # replace with "name: <self-hosted pool>" if the appliance firewall needs fixed IPs

variables:
  # ---- REPLACE EVERY <PLACEHOLDER> BELOW WITH YOUR OWN VALUES (same values as drift-check.yml) ----
  azureServiceConnection: '<SERVICE-CONNECTION-NAME>'
  keyVaultName:           '<KEY-VAULT-NAME>'
  keyVaultUsernameSecretName: '<USERNAME-SECRET-NAME>'      # name of the Key Vault secret holding the VBA user name
  keyVaultPasswordSecretName: '<PASSWORD-SECRET-NAME>'      # name of the Key Vault secret holding the VBA password
  vbaAppliance:           '<VBA-IP-ADDRESS>'
  # -----------------------------------------------------

steps:
  - checkout: self

  - task: AzureKeyVault@2
    displayName: Read VBA credentials from Key Vault
    inputs:
      azureSubscription: ${{ variables.azureServiceConnection }}
      KeyVaultName: ${{ variables.keyVaultName }}
      SecretsFilter: '${{ variables.keyVaultUsernameSecretName }},${{ variables.keyVaultPasswordSecretName }}'
      RunAsPreJob: false

  - pwsh: |
      ./scripts/Test-VbaUserDrift.ps1 `
        -Appliance '$(vbaAppliance)' `
        -UserDir ./users `
        -ReportPath '$(Build.ArtifactStagingDirectory)/user-drift-report.json' `
        -FailOnUnmanaged
      exit $LASTEXITCODE
    displayName: Check users and roles for drift (detect only)
    env:
      VBA_USERNAME: $(${{ variables.keyVaultUsernameSecretName }})
      VBA_PASSWORD: $(${{ variables.keyVaultPasswordSecretName }})

  - task: PublishPipelineArtifact@1
    displayName: Publish user drift report
    condition: always()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/user-drift-report.json'
      artifact: user-drift-report
